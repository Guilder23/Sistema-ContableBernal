<section class="expense-modal" id="modal-editar" role="dialog" aria-modal="true" aria-labelledby="expense-edit-title" {% if modal_activo != 'modal-editar' %}hidden{% endif %}>
  <div class="expense-modal__backdrop" data-close-expense-modal></div>
  <div class="expense-modal__panel">
    <header><div><p class="eyebrow">ACTUALIZAR REGISTRO</p><h2 id="expense-edit-title">Editar movimiento</h2></div><button class="expense-modal__close" type="button" data-close-expense-modal aria-label="Cerrar">Cerrar</button></header>
    <form method="post" action="{% if registro_edicion %}{% url 'gastos:editar' registro_id=registro_edicion.pk %}{% endif %}" class="expense-form" data-expense-edit-form>
      {% csrf_token %}
      {% if errores.general %}<p class="expense-form__error">{{ errores.general }}</p>{% endif %}
      <div class="expense-form__grid">
        <label class="expense-form__field expense-form__field--wide"><span>Concepto <b>*</b></span><input name="concepto" data-edit-field="concepto" maxlength="180" required value="{% if modal_activo == 'modal-editar' %}{{ form_data.concepto }}{% endif %}"></label>
        {% if errores.concepto %}<small class="expense-form__error">{{ errores.concepto }}</small>{% endif %}
        <label class="expense-form__field"><span>Tipo de movimiento <b>*</b></span><select name="tipo" data-edit-field="tipo" required><option value="">Seleccionar</option>{% for value, label in tipos %}<option value="{{ value }}" {% if modal_activo == 'modal-editar' and form_data.tipo == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% if errores.tipo %}<small class="expense-form__error">{{ errores.tipo }}</small>{% endif %}</label>
        <label class="expense-form__field"><span>Categoría <b>*</b></span><select name="categoria" data-edit-field="categoria" required><option value="">Seleccionar</option><optgroup label="Gastos" data-edit-categoria-tipo="gasto">{% for value, label in categorias_por_tipo.gasto %}<option value="{{ value }}" {% if modal_activo == 'modal-editar' and form_data.categoria == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</optgroup><optgroup label="Inversiones" data-edit-categoria-tipo="inversion">{% for value, label in categorias_por_tipo.inversion %}<option value="{{ value }}" {% if modal_activo == 'modal-editar' and form_data.categoria == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</optgroup><optgroup label="Egresos" data-edit-categoria-tipo="egreso">{% for value, label in categorias_por_tipo.egreso %}<option value="{{ value }}" {% if modal_activo == 'modal-editar' and form_data.categoria == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</optgroup></select>{% if errores.categoria %}<small class="expense-form__error">{{ errores.categoria }}</small>{% endif %}</label>
        <label class="expense-form__field"><span>Periodicidad <b>*</b></span><select name="periodicidad" data-edit-field="periodicidad" required>{% for value, label in periodicidades %}<option value="{{ value }}" {% if modal_activo == 'modal-editar' and form_data.periodicidad == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% if errores.periodicidad %}<small class="expense-form__error">{{ errores.periodicidad }}</small>{% endif %}</label>
        <label class="expense-form__field"><span>Monto (Bs) <b>*</b></span><input name="monto" data-edit-field="monto" type="number" min="0.01" step="0.01" required value="{% if modal_activo == 'modal-editar' %}{{ form_data.monto }}{% endif %}">{% if errores.monto %}<small class="expense-form__error">{{ errores.monto }}</small>{% endif %}</label>
        <label class="expense-form__field"><span>Fecha <b>*</b></span><input name="fecha" data-edit-field="fecha" type="date" required value="{% if modal_activo == 'modal-editar' %}{{ form_data.fecha }}{% endif %}">{% if errores.fecha %}<small class="expense-form__error">{{ errores.fecha }}</small>{% endif %}</label>
        <label class="expense-form__field"><span>Proveedor</span><input name="proveedor" data-edit-field="proveedor" maxlength="180" value="{% if modal_activo == 'modal-editar' %}{{ form_data.proveedor }}{% endif %}"></label>
        <label class="expense-form__field"><span>Responsable</span><input name="responsable" data-edit-field="responsable" maxlength="180" value="{% if modal_activo == 'modal-editar' %}{{ form_data.responsable }}{% endif %}"></label>
        <label class="expense-form__field"><span>Comprobante / factura</span><input name="comprobante" data-edit-field="comprobante" maxlength="120" value="{% if modal_activo == 'modal-editar' %}{{ form_data.comprobante }}{% endif %}"></label>
        <label class="expense-form__field"><span>Estado de pago</span><select name="estado_pago" data-edit-field="estado_pago">{% for value, label in estados_pago %}<option value="{{ value }}" {% if modal_activo == 'modal-editar' and form_data.estado_pago == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
      </div>
      <fieldset class="expense-form__section"><legend>Salida recuperable</legend><label class="expense-form__check"><input type="checkbox" name="recuperable" value="1" data-edit-field="recuperable" {% if modal_activo == 'modal-editar' and form_data.recuperable %}checked{% endif %}> Este monto se cobrará a un cliente</label>
        <div class="expense-form__grid" data-edit-recovery-fields><label class="expense-form__field"><span>Cliente <b>*</b></span><select name="cliente" data-edit-field="cliente"><option value="">Seleccionar cliente</option>{% for cliente in clientes %}<option value="{{ cliente.pk }}" {% if modal_activo == 'modal-editar' and form_data.cliente == cliente.pk|stringformat:'s' %}selected{% endif %}>{{ cliente.nombre }}{% if cliente.razon_social %} · {{ cliente.razon_social }}{% endif %}</option>{% endfor %}</select>{% if errores.cliente %}<small class="expense-form__error">{{ errores.cliente }}</small>{% endif %}</label><label class="expense-form__field"><span>Estado de recuperación</span><select name="estado_recuperacion" data-edit-field="estado_recuperacion">{% for value, label in estados_recuperacion %}<option value="{{ value }}" {% if modal_activo == 'modal-editar' and form_data.estado_recuperacion == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label></div>
      </fieldset>
      <fieldset class="expense-form__section" data-edit-investment-section><legend>Datos del activo</legend><div class="expense-form__grid"><label class="expense-form__field"><span>Vida útil (meses) <b>*</b></span><input name="vida_util_meses" data-edit-field="vida_util_meses" type="number" min="1" max="1200" value="{% if modal_activo == 'modal-editar' %}{{ form_data.vida_util_meses }}{% endif %}">{% if errores.vida_util_meses %}<small class="expense-form__error">{{ errores.vida_util_meses }}</small>{% endif %}</label><label class="expense-form__field"><span>Estado del activo</span><select name="estado_activo" data-edit-field="estado_activo">{% for value, label in estados_activo %}<option value="{{ value }}" {% if modal_activo == 'modal-editar' and form_data.estado_activo == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label class="expense-form__field expense-form__field--wide"><span>Ubicación</span><input name="ubicacion" data-edit-field="ubicacion" maxlength="180" value="{% if modal_activo == 'modal-editar' %}{{ form_data.ubicacion }}{% endif %}"></label></div></fieldset>
      <label class="expense-form__field"><span>Observaciones</span><textarea name="observaciones" data-edit-field="observaciones" rows="3">{% if modal_activo == 'modal-editar' %}{{ form_data.observaciones }}{% endif %}</textarea></label>
      <footer><button class="button button--quiet" type="button" data-close-expense-modal>Cancelar</button><button class="button button--primary" type="submit">Guardar cambios</button></footer>
    </form>
  </div>
</section>
