{% load static %}
<section class="client-modal" id="modal-registrar-pago" role="dialog" aria-modal="true" aria-labelledby="modal-reg-pago-title" hidden>
	<div class="client-modal__backdrop" data-close-modal></div>
	<div class="client-modal__panel">
		<header>
			<div>
				<p class="eyebrow">CONTROL DE CAJA Y COBRANZAS</p>
				<h2 id="modal-reg-pago-title">Registrar pago / cobro</h2>
			</div>
			<button class="modal-close" type="button" data-close-modal aria-label="Cerrar">Cerrar</button>
		</header>
		<form method="post" action="{% url 'honorarios:registrar_pago' %}" enctype="multipart/form-data" id="form-registrar-pago" class="client-form">
			{% csrf_token %}
			<input type="hidden" name="cobro_id" id="pago-cobro-id" value="">
			<input type="hidden" name="volver" value="{{ volver|default:request.get_full_path }}">

			<div style="background:#f8faf9; border:1px solid var(--line); border-radius:6px; padding:12px; margin-bottom:14px;">
				<div style="font-size:13px; color:#65746b;">Cliente / Cuenta:</div>
				<strong id="pago-cliente-nombre" style="font-size:15px; color:var(--ink); display:block;">—</strong>
				<div style="font-size:13px; color:#65746b; margin-top:4px;">Concepto: <span id="pago-concepto" style="color:var(--ink); font-weight:600;">—</span></div>
				<div style="font-size:13px; color:#65746b; margin-top:2px;">Saldo pendiente: <strong id="pago-saldo-pendiente" style="color:#b91c1c;">Bs 0.00</strong></div>
			</div>

			<div class="client-form__row">
				<label class="client-field">
					<span>Monto pagado (Bs) <b>*</b></span>
					<input type="number" step="0.01" name="monto" id="pago-monto" min="0.01" required placeholder="0.00">
				</label>
				<label class="client-field">
					<span>Fecha de pago <b>*</b></span>
					<input type="date" name="fecha_pago" value="{{ hoy|date:'Y-m-d' }}" required>
				</label>
			</div>

			<div class="client-form__row">
				<label class="client-field">
					<span>N.º de Recibo / Comprobante</span>
					<input name="numero_recibo" placeholder="Ej: REC-00421">
				</label>
				<label class="client-field">
					<span>Forma de pago <b>*</b></span>
					<select name="metodo_pago" required>
						{% for val, lab in metodos_pago %}
						<option value="{{ val }}">{{ lab }}</option>
						{% endfor %}
					</select>
				</label>
			</div>

			<label class="client-field">
				<span>Comprobante de depósito / respaldo (opcional)</span>
				<input type="file" name="comprobante" accept="image/*,.pdf">
			</label>

			<label class="client-field">
				<span>Observaciones o notas de cobro</span>
				<textarea name="observaciones" rows="2" placeholder="Ej: Pago realizado por QR en caja..."></textarea>
			</label>

			<footer>
				<button class="button button--quiet" type="button" data-close-modal>Cancelar</button>
				<button class="button button--primary" type="submit">Confirmar pago</button>
			</footer>
		</form>
	</div>
</section>
