<section class="client-modal" id="modal-eliminar" role="dialog" aria-modal="true" aria-labelledby="modal-eliminar-title" hidden>
	<div class="client-modal__backdrop" data-close-modal></div><div class="client-modal__panel client-modal__panel--confirm"><header><div><p class="eyebrow">ACCIÓN PERMANENTE</p><h2 id="modal-eliminar-title">Eliminar cliente</h2></div><button class="modal-close" type="button" data-close-modal aria-label="Cerrar">Cerrar</button></header>
	<p class="client-delete-copy">Se eliminará <strong data-client-delete-name></strong> del directorio. Esta acción no se puede deshacer.</p>
	<form method="post" data-client-delete-form>{% csrf_token %}<footer><button class="button button--quiet" type="button" data-close-modal>Cancelar</button><button class="button button--danger" type="submit">Eliminar cliente</button></footer></form></div>
</section>
