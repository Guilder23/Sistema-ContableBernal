<section class="client-modal" id="modal-crear" role="dialog" aria-modal="true" aria-labelledby="modal-crear-title" {% if modal_activo != 'modal-crear' %}hidden{% endif %}>
	<div class="client-modal__backdrop" data-close-modal></div><div class="client-modal__panel"><header><div><p class="eyebrow">NUEVO REGISTRO</p><h2 id="modal-crear-title">Crear cliente</h2></div><button class="modal-close" type="button" data-close-modal aria-label="Cerrar">Cerrar</button></header>
	<form method="post" action="{% url 'clientes:crear' %}" class="client-form" data-client-create-form>{% csrf_token %}
		{% if errores.general %}<p class="client-field-error">{{ errores.general }}</p>{% endif %}
		<div class="client-form__row"><label class="client-field"><span>Nombre del cliente o contacto principal <b>*</b></span><input name="nombre" value="{{ datos.nombre|default:'' }}" maxlength="180" required>{% if errores.nombre %}<small class="client-field-error">{{ errores.nombre }}</small>{% endif %}</label><label class="client-field"><span>Tipo de cliente <b>*</b></span><select name="tipo" required>{% for value, label in tipos %}<option value="{{ value }}" {% if datos.tipo == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% if errores.tipo %}<small class="client-field-error">{{ errores.tipo }}</small>{% endif %}</label></div>
		<div class="client-form__row" data-client-seprec-name-section {% if not datos.tiene_seprec %}hidden{% endif %}><label class="client-field"><span>Razón social o nombre de la empresa <b>*</b></span><input name="razon_social" value="{{ datos.razon_social|default:'' }}" maxlength="180">{% if errores.razon_social %}<small class="client-field-error">{{ errores.razon_social }}</small>{% endif %}</label><span></span></div>
		<div class="client-form__row" data-client-legal-form-section {% if datos.tipo != 'juridica' %}hidden{% endif %}><label class="client-field"><span>Forma jurídica <b>*</b></span><select name="forma_juridica"><option value="">Selecciona una forma jurídica</option>{% for value, label in formas_juridicas %}<option value="{{ value }}" {% if datos.forma_juridica == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% if errores.forma_juridica %}<small class="client-field-error">{{ errores.forma_juridica }}</small>{% endif %}</label><label class="client-field" data-client-legal-form-detail-section {% if datos.forma_juridica != 'otra' or datos.tipo != 'juridica' %}hidden{% endif %}><span>Detalle de forma jurídica <b>*</b></span><input name="forma_juridica_detalle" value="{{ datos.forma_juridica_detalle|default:'' }}" maxlength="100">{% if errores.forma_juridica_detalle %}<small class="client-field-error">{{ errores.forma_juridica_detalle }}</small>{% endif %}</label></div>
		<div class="client-form__row"><label class="client-field"><span>Actividad / rubro <b>*</b></span><select name="actividad" required><option value="">Selecciona una actividad</option>{% for value, label in actividades %}<option value="{{ value }}" {% if datos.actividad == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% if errores.actividad %}<small class="client-field-error">{{ errores.actividad }}</small>{% endif %}</label><label class="client-field" data-client-activity-detail-section {% if datos.actividad != 'otra' %}hidden{% endif %}><span>Detalle de actividad</span><input name="actividad_detalle" value="{{ datos.actividad_detalle|default:'' }}" maxlength="120">{% if errores.actividad_detalle %}<small class="client-field-error">{{ errores.actividad_detalle }}</small>{% endif %}</label></div>
		<div class="client-form__row"><label class="client-field"><span>Tiene SEPREC</span><select name="tiene_seprec"><option value="no" {% if not datos.tiene_seprec %}selected{% endif %}>No</option><option value="si" {% if datos.tiene_seprec %}selected{% endif %}>Sí</option></select></label><label class="client-field"><span>Tiene ROE</span><select name="tiene_roe"><option value="no" {% if not datos.tiene_roe %}selected{% endif %}>No</option><option value="si" {% if datos.tiene_roe %}selected{% endif %}>Sí</option></select></label></div>
		<div class="client-form__row"><label class="client-field"><span>NIT</span><input name="nit" value="{{ datos.nit|default:'' }}" maxlength="20">{% if errores.nit %}<small class="client-field-error">{{ errores.nit }}</small>{% endif %}</label><label class="client-field" data-client-personal-id-field {% if datos.tipo == 'juridica' %}hidden{% endif %}><span>CI</span><input name="ci" value="{{ datos.ci|default:'' }}" maxlength="20">{% if errores.ci %}<small class="client-field-error">{{ errores.ci }}</small>{% endif %}</label></div>
		<div class="client-form__row" data-client-personal-id-row {% if datos.tipo == 'juridica' %}hidden{% endif %}><label class="client-field"><span>Complemento de CI</span><input name="ci_complemento" value="{{ datos.ci_complemento|default:'' }}" maxlength="10">{% if errores.ci_complemento %}<small class="client-field-error">{{ errores.ci_complemento }}</small>{% endif %}</label><label class="client-field"><span>CI expedido</span><input name="ci_expedido" value="{{ datos.ci_expedido|default:'' }}" maxlength="20">{% if errores.ci_expedido %}<small class="client-field-error">{{ errores.ci_expedido }}</small>{% endif %}</label></div>
		<div class="client-form__row"><label class="client-field" data-client-personal-id-field {% if datos.tipo == 'juridica' %}hidden{% endif %}><span>Fecha de nacimiento</span><input name="fecha_nacimiento" type="date" value="{{ datos.fecha_nacimiento|default:'' }}">{% if errores.fecha_nacimiento %}<small class="client-field-error">{{ errores.fecha_nacimiento }}</small>{% endif %}</label><span></span></div>
		<div class="client-form__row client-form__row--counter"><label class="client-field"><span>Fecha de inicio de actividad</span><input name="fecha_inicio" type="date" value="{{ datos.fecha_inicio|default:'' }}">{% if errores.fecha_inicio %}<small class="client-field-error">{{ errores.fecha_inicio }}</small>{% endif %}</label><div class="client-counter-control"><label class="client-check"><input type="checkbox" name="cambio_contador" value="1" {% if datos.cambio_contador %}checked{% endif %}> Cambio de contador</label><label class="client-field" data-client-counter-date-section {% if not datos.cambio_contador %}hidden{% endif %}><span>Mes y año del cambio <b>*</b></span><input name="fecha_cambio_contador" type="month" value="{{ datos.fecha_cambio_contador|default:'' }}">{% if errores.fecha_cambio_contador %}<small class="client-field-error">{{ errores.fecha_cambio_contador }}</small>{% endif %}</label></div></div>
		<div class="client-form__row"><label class="client-field"><span>Tipo de facturación</span><select name="tipo_facturacion"><option value="">Selecciona una opción</option>{% for value, label in tipos_facturacion %}<option value="{{ value }}" {% if datos.tipo_facturacion == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% if errores.tipo_facturacion %}<small class="client-field-error">{{ errores.tipo_facturacion }}</small>{% endif %}</label><label class="client-field"><span>Fecha de vencimiento</span><input name="fecha_vencimiento_facturacion" type="date" value="{{ datos.fecha_vencimiento_facturacion|default:'' }}">{% if errores.fecha_vencimiento_facturacion %}<small class="client-field-error">{{ errores.fecha_vencimiento_facturacion }}</small>{% endif %}</label></div>
		<div class="client-form__row"><label class="client-field"><span>Teléfono</span><input name="telefono" value="{{ datos.telefono|default:'' }}" maxlength="30" autocomplete="tel">{% if errores.telefono %}<small class="client-field-error">{{ errores.telefono }}</small>{% endif %}</label><label class="client-field"><span>WhatsApp</span><input name="whatsapp" value="{{ datos.whatsapp|default:'' }}" maxlength="30">{% if errores.whatsapp %}<small class="client-field-error">{{ errores.whatsapp }}</small>{% endif %}</label></div>
		<label class="client-check"><input type="checkbox" name="tiene_representante_legal" value="1" data-toggle-representante-legal {% if datos.tiene_representante_legal %}checked{% endif %}> Tiene representante legal</label>
		<div class="client-representante-legal-block" data-representante-legal-section {% if not datos.tiene_representante_legal %}hidden{% endif %}>
			<div class="client-form__row"><label class="client-field"><span>Nombre completo del representante legal</span><input name="representante_legal_nombre" value="{{ datos.representante_legal_nombre|default:'' }}" maxlength="180">{% if errores.representante_legal_nombre %}<small class="client-field-error">{{ errores.representante_legal_nombre }}</small>{% endif %}</label><label class="client-field"><span>Carnet del representante</span><input name="representante_legal_carnet" value="{{ datos.representante_legal_carnet|default:'' }}" maxlength="20">{% if errores.representante_legal_carnet %}<small class="client-field-error">{{ errores.representante_legal_carnet }}</small>{% endif %}</label></div>
			<div class="client-form__row"><label class="client-field"><span>Complemento</span><input name="representante_legal_complemento" value="{{ datos.representante_legal_complemento|default:'' }}" maxlength="10">{% if errores.representante_legal_complemento %}<small class="client-field-error">{{ errores.representante_legal_complemento }}</small>{% endif %}</label><label class="client-field"><span>Expedido</span><input name="representante_legal_expedido" value="{{ datos.representante_legal_expedido|default:'' }}" maxlength="20">{% if errores.representante_legal_expedido %}<small class="client-field-error">{{ errores.representante_legal_expedido }}</small>{% endif %}</label></div>
			<div class="client-form__row"><label class="client-field"><span>Celular</span><input name="representante_legal_celular" value="{{ datos.representante_legal_celular|default:'' }}" maxlength="30">{% if errores.representante_legal_celular %}<small class="client-field-error">{{ errores.representante_legal_celular }}</small>{% endif %}</label><label class="client-field"><span>Fecha de nacimiento</span><input name="representante_legal_fecha_nacimiento" type="date" value="{{ datos.representante_legal_fecha_nacimiento|default:'' }}">{% if errores.representante_legal_fecha_nacimiento %}<small class="client-field-error">{{ errores.representante_legal_fecha_nacimiento }}</small>{% endif %}</label></div>
		</div>
		<label class="client-field"><span>Dirección</span><input name="direccion" value="{{ datos.direccion|default:'' }}" maxlength="240" autocomplete="street-address">{% if errores.direccion %}<small class="client-field-error">{{ errores.direccion }}</small>{% endif %}</label>
		<label class="client-field"><span>Observaciones</span><textarea name="observaciones" rows="3">{{ datos.observaciones|default:'' }}</textarea></label>
		<label class="client-check"><input type="checkbox" name="estado" value="activo" {% if datos.estado == 'activo' or not datos %}checked{% endif %}> Cliente activo</label>
		<footer><button class="button button--quiet" type="button" data-close-modal>Cancelar</button><button class="button button--primary" type="submit">Guardar cliente</button></footer>
	</form></div>
</section>
