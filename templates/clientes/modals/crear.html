<section class="client-modal" id="modal-crear" role="dialog" aria-modal="true" aria-labelledby="modal-crear-title" {% if modal_activo != 'modal-crear' %}hidden{% endif %}>
	<div class="client-modal__backdrop" data-close-modal></div><div class="client-modal__panel"><header><div><p class="eyebrow">NUEVO REGISTRO</p><h2 id="modal-crear-title">Crear cliente</h2></div><button class="modal-close" type="button" data-close-modal aria-label="Cerrar">Cerrar</button></header>
	<form method="post" action="{% url 'clientes:crear' %}" class="client-form">{% csrf_token %}
		{% if errores.general %}<p class="client-field-error">{{ errores.general }}</p>{% endif %}
		<label class="client-field"><span>Nombre del cliente <b>*</b></span><input name="nombre" value="{{ datos.nombre|default:'' }}" maxlength="180" required><small class="client-field-help">Nombre del cliente o contacto principal.</small>{% if errores.nombre %}<small class="client-field-error">{{ errores.nombre }}</small>{% endif %}</label>
		<label class="client-field"><span>Razón social o nombre de la empresa</span><input name="razon_social" value="{{ datos.razon_social|default:'' }}" maxlength="180"><small class="client-field-help">Opcional: nombre legal de la empresa o razón social.</small>{% if errores.razon_social %}<small class="client-field-error">{{ errores.razon_social }}</small>{% endif %}</label>
		<div class="client-form__row"><label class="client-field"><span>Tipo de cliente <b>*</b></span><select name="tipo" required><option value="" disabled {% if not datos.tipo %}selected{% endif %}>Selecciona un tipo</option>{% for value, label in tipos %}<option value="{{ value }}" {% if datos.tipo == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><small class="client-field-help">Clasifica la ficha para configurar sus obligaciones.</small>{% if errores.tipo %}<small class="client-field-error">{{ errores.tipo }}</small>{% endif %}</label><label class="client-field"><span>Actividad / rubro <b>*</b></span><select name="actividad" required><option value="" disabled {% if not datos.actividad %}selected{% endif %}>Selecciona una actividad</option>{% for value, label in actividades %}<option value="{{ value }}" {% if datos.actividad == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><small class="client-field-help">Se usa para calcular el cierre fiscal anual.</small>{% if errores.actividad %}<small class="client-field-error">{{ errores.actividad }}</small>{% endif %}</label></div>
		<div class="client-form__row"><label class="client-field"><span>NIT</span><input name="nit" value="{{ datos.nit|default:'' }}" maxlength="20"><small class="client-field-help">El último dígito calcula vencimientos de IVA e IT; déjalo vacío si no corresponde.</small>{% if errores.nit %}<small class="client-field-error">{{ errores.nit }}</small>{% endif %}</label><label class="client-field"><span>CI</span><input name="ci" value="{{ datos.ci|default:'' }}" maxlength="20"><small class="client-field-help">Identificación personal para la ficha del cliente.</small>{% if errores.ci %}<small class="client-field-error">{{ errores.ci }}</small>{% endif %}</label></div>
		<div class="client-form__row"><label class="client-field"><span>Complemento de CI</span><input name="ci_complemento" value="{{ datos.ci_complemento|default:'' }}" maxlength="10"><small class="client-field-help">Ej: A, B, C.</small>{% if errores.ci_complemento %}<small class="client-field-error">{{ errores.ci_complemento }}</small>{% endif %}</label><label class="client-field"><span>CI expedido</span><input name="ci_expedido" value="{{ datos.ci_expedido|default:'' }}" maxlength="20"><small class="client-field-help">Departamento o ciudad donde se emitió el documento.</small>{% if errores.ci_expedido %}<small class="client-field-error">{{ errores.ci_expedido }}</small>{% endif %}</label></div>
		<div class="client-form__row"><label class="client-field"><span>Fecha de nacimiento</span><input name="fecha_nacimiento" type="date" value="{{ datos.fecha_nacimiento|default:'' }}"><small class="client-field-help">Fecha de nacimiento del cliente.</small>{% if errores.fecha_nacimiento %}<small class="client-field-error">{{ errores.fecha_nacimiento }}</small>{% endif %}</label><label class="client-check" style="align-self:flex-end;"><input type="checkbox" name="cambio_contador" value="1" {% if datos.cambio_contador %}checked{% endif %}> Cambio de contador</label></div>
		<div class="client-form__row"><label class="client-field"><span>Teléfono</span><input name="telefono" value="{{ datos.telefono|default:'' }}" maxlength="30" autocomplete="tel"><small class="client-field-help">Número de contacto principal.</small>{% if errores.telefono %}<small class="client-field-error">{{ errores.telefono }}</small>{% endif %}</label><label class="client-field"><span>WhatsApp</span><input name="whatsapp" value="{{ datos.whatsapp|default:'' }}" maxlength="30"><small class="client-field-help">Contacto por WhatsApp del cliente.</small>{% if errores.whatsapp %}<small class="client-field-error">{{ errores.whatsapp }}</small>{% endif %}</label></div>
		<div class="client-form__row"><label class="client-field"><span>Correo</span><input name="correo" type="email" value="{{ datos.correo|default:'' }}" maxlength="254" autocomplete="email"><small class="client-field-help">Correo de contacto para comunicaciones del estudio.</small>{% if errores.correo %}<small class="client-field-error">{{ errores.correo }}</small>{% endif %}</label><label class="client-field"><span>Fecha de inicio</span><input name="fecha_inicio" type="date" value="{{ datos.fecha_inicio|default:'' }}"><small class="client-field-help">Vigencia inicial sugerida al configurar obligaciones.</small>{% if errores.fecha_inicio %}<small class="client-field-error">{{ errores.fecha_inicio }}</small>{% endif %}</label></div>
		<label class="client-check"><input type="checkbox" name="tiene_representante_legal" value="1" data-toggle-representante-legal {% if datos.tiene_representante_legal %}checked{% endif %}> Tiene representante legal</label>
		<div class="client-representante-legal-block" data-representante-legal-section {% if not datos.tiene_representante_legal %}hidden{% endif %}>
			<div class="client-form__row"><label class="client-field"><span>Nombre completo del representante legal</span><input name="representante_legal_nombre" value="{{ datos.representante_legal_nombre|default:'' }}" maxlength="180"><small class="client-field-help">Nombre completo del titular legal.</small>{% if errores.representante_legal_nombre %}<small class="client-field-error">{{ errores.representante_legal_nombre }}</small>{% endif %}</label><label class="client-field"><span>Carnet del representante</span><input name="representante_legal_carnet" value="{{ datos.representante_legal_carnet|default:'' }}" maxlength="20"><small class="client-field-help">Carnet de identidad del representante.</small>{% if errores.representante_legal_carnet %}<small class="client-field-error">{{ errores.representante_legal_carnet }}</small>{% endif %}</label></div>
			<div class="client-form__row"><label class="client-field"><span>Complemento</span><input name="representante_legal_complemento" value="{{ datos.representante_legal_complemento|default:'' }}" maxlength="10"><small class="client-field-help">Complemento del carnet.</small>{% if errores.representante_legal_complemento %}<small class="client-field-error">{{ errores.representante_legal_complemento }}</small>{% endif %}</label><label class="client-field"><span>Expedido</span><input name="representante_legal_expedido" value="{{ datos.representante_legal_expedido|default:'' }}" maxlength="20"><small class="client-field-help">Lugar de expedición.</small>{% if errores.representante_legal_expedido %}<small class="client-field-error">{{ errores.representante_legal_expedido }}</small>{% endif %}</label></div>
			<div class="client-form__row"><label class="client-field"><span>Celular</span><input name="representante_legal_celular" value="{{ datos.representante_legal_celular|default:'' }}" maxlength="30"><small class="client-field-help">Número para contacto del representante.</small>{% if errores.representante_legal_celular %}<small class="client-field-error">{{ errores.representante_legal_celular }}</small>{% endif %}</label><label class="client-field"><span>Fecha de nacimiento</span><input name="representante_legal_fecha_nacimiento" type="date" value="{{ datos.representante_legal_fecha_nacimiento|default:'' }}"><small class="client-field-help">Fecha de nacimiento del representante.</small>{% if errores.representante_legal_fecha_nacimiento %}<small class="client-field-error">{{ errores.representante_legal_fecha_nacimiento }}</small>{% endif %}</label></div>
		</div>
		<label class="client-field"><span>Dirección</span><input name="direccion" value="{{ datos.direccion|default:'' }}" maxlength="240" autocomplete="street-address"><small class="client-field-help">Domicilio registrado en la ficha.</small>{% if errores.direccion %}<small class="client-field-error">{{ errores.direccion }}</small>{% endif %}</label>
		<label class="client-field"><span>Observaciones</span><textarea name="observaciones" rows="3">{{ datos.observaciones|default:'' }}</textarea><small class="client-field-help">Notas internas del estudio sobre el cliente.</small></label>
		<label class="client-check"><input type="checkbox" name="estado" value="activo" {% if datos.estado == 'activo' or not datos %}checked{% endif %}> Cliente activo</label><small class="client-field-help">Solo los clientes activos participan en la generación de obligaciones.</small>
		<footer><button class="button button--quiet" type="button" data-close-modal>Cancelar</button><button class="button button--primary" type="submit">Guardar cliente</button></footer>
	</form></div>
</section>
