<section class="client-modal" id="modal-crear" role="dialog" aria-modal="true" aria-labelledby="modal-crear-title" {% if modal_activo != 'modal-crear' %}hidden{% endif %}>
	<div class="client-modal__backdrop" data-close-modal></div><div class="client-modal__panel"><header><div><p class="eyebrow">NUEVO REGISTRO</p><h2 id="modal-crear-title">Crear cliente</h2></div><button class="modal-close" type="button" data-close-modal aria-label="Cerrar">Cerrar</button></header>
	<form method="post" action="{% url 'clientes:crear' %}" class="client-form">{% csrf_token %}
		{% if errores.general %}<p class="client-field-error">{{ errores.general }}</p>{% endif %}
		<label class="client-field"><span>Nombre o razón social <b>*</b></span><input name="nombre" value="{{ datos.nombre|default:'' }}" maxlength="180" required>{% if errores.nombre %}<small class="client-field-error">{{ errores.nombre }}</small>{% endif %}</label>
		<div class="client-form__row"><label class="client-field"><span>Tipo de cliente</span><select name="tipo" required>{% for value, label in tipos %}<option value="{{ value }}" {% if datos.tipo == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% if errores.tipo %}<small class="client-field-error">{{ errores.tipo }}</small>{% endif %}</label><label class="client-field"><span>Actividad / rubro</span><select name="actividad" required>{% for value, label in actividades %}<option value="{{ value }}" {% if datos.actividad == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% if errores.actividad %}<small class="client-field-error">{{ errores.actividad }}</small>{% endif %}</label></div>
		<div class="client-form__row"><label class="client-field"><span>NIT</span><input name="nit" value="{{ datos.nit|default:'' }}" maxlength="20">{% if errores.nit %}<small class="client-field-error">{{ errores.nit }}</small>{% endif %}</label><label class="client-field"><span>CI</span><input name="ci" value="{{ datos.ci|default:'' }}" maxlength="20">{% if errores.ci %}<small class="client-field-error">{{ errores.ci }}</small>{% endif %}</label></div>
		<div class="client-form__row"><label class="client-field"><span>Teléfono</span><input name="telefono" value="{{ datos.telefono|default:'' }}" maxlength="30" autocomplete="tel">{% if errores.telefono %}<small class="client-field-error">{{ errores.telefono }}</small>{% endif %}</label><label class="client-field"><span>WhatsApp</span><input name="whatsapp" value="{{ datos.whatsapp|default:'' }}" maxlength="30">{% if errores.whatsapp %}<small class="client-field-error">{{ errores.whatsapp }}</small>{% endif %}</label></div>
		<div class="client-form__row"><label class="client-field"><span>Correo</span><input name="correo" type="email" value="{{ datos.correo|default:'' }}" maxlength="254" autocomplete="email">{% if errores.correo %}<small class="client-field-error">{{ errores.correo }}</small>{% endif %}</label><label class="client-field"><span>Fecha de inicio</span><input name="fecha_inicio" type="date" value="{{ datos.fecha_inicio|default:'' }}">{% if errores.fecha_inicio %}<small class="client-field-error">{{ errores.fecha_inicio }}</small>{% endif %}</label></div>
		<label class="client-field"><span>Dirección</span><input name="direccion" value="{{ datos.direccion|default:'' }}" maxlength="240" autocomplete="street-address">{% if errores.direccion %}<small class="client-field-error">{{ errores.direccion }}</small>{% endif %}</label>
		<label class="client-field"><span>Observaciones</span><textarea name="observaciones" rows="3">{{ datos.observaciones|default:'' }}</textarea></label>
		<label class="client-check"><input type="checkbox" name="estado" value="activo" {% if datos.estado == 'activo' or not datos %}checked{% endif %}> Cliente activo</label>
		<footer><button class="button button--quiet" type="button" data-close-modal>Cancelar</button><button class="button button--primary" type="submit">Guardar cliente</button></footer>
	</form></div>
</section>
