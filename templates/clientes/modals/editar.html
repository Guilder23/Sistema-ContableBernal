<section class="client-modal" id="modal-editar" role="dialog" aria-modal="true" aria-labelledby="modal-editar-title" {% if modal_activo != 'modal-editar' %}hidden{% endif %}>
	<div class="client-modal__backdrop" data-close-modal></div><div class="client-modal__panel"><header><div><p class="eyebrow">ACTUALIZAR REGISTRO</p><h2 id="modal-editar-title">Editar cliente</h2></div><button class="modal-close" type="button" data-close-modal aria-label="Cerrar">Cerrar</button></header>
	<form method="post" class="client-form" data-client-edit-form {% if cliente_edicion %}action="{% url 'clientes:editar' cliente_id=cliente_edicion.pk %}"{% endif %}>{% csrf_token %}
		{% if errores.general %}<p class="client-field-error">{{ errores.general }}</p>{% endif %}
		<label class="client-field"><span>Nombre del cliente <b>*</b></span><input name="nombre" data-client-edit-field="nombre" value="{% if modal_activo == 'modal-editar' %}{{ datos.nombre }}{% endif %}" maxlength="180" required><small class="client-field-help">Nombre del cliente o contacto principal.</small>{% if errores.nombre %}<small class="client-field-error">{{ errores.nombre }}</small>{% endif %}</label>
		<label class="client-field"><span>Razón social o nombre de la empresa</span><input name="razon_social" data-client-edit-field="razon_social" value="{% if modal_activo == 'modal-editar' %}{{ datos.razon_social }}{% endif %}" maxlength="180"><small class="client-field-help">Opcional: nombre legal de la empresa o razón social.</small>{% if errores.razon_social %}<small class="client-field-error">{{ errores.razon_social }}</small>{% endif %}</label>
		<div class="client-form__row"><label class="client-field"><span>Tipo de cliente <b>*</b></span><select name="tipo" data-client-edit-field="tipo" required><option value="" disabled>Selecciona un tipo</option>{% for value, label in tipos %}<option value="{{ value }}" {% if modal_activo == 'modal-editar' and datos.tipo == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><small class="client-field-help">Clasifica la ficha para configurar sus obligaciones.</small>{% if errores.tipo %}<small class="client-field-error">{{ errores.tipo }}</small>{% endif %}</label><label class="client-field"><span>Actividad / rubro <b>*</b></span><select name="actividad" data-client-edit-field="actividad" required><option value="" disabled>Selecciona una actividad</option>{% for value, label in actividades %}<option value="{{ value }}" {% if modal_activo == 'modal-editar' and datos.actividad == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><small class="client-field-help">Se usa para calcular el cierre fiscal anual.</small>{% if errores.actividad %}<small class="client-field-error">{{ errores.actividad }}</small>{% endif %}</label></div>
		<div class="client-form__row"><label class="client-field"><span>NIT</span><input name="nit" data-client-edit-field="nit" value="{% if modal_activo == 'modal-editar' %}{{ datos.nit }}{% endif %}" maxlength="20"><small class="client-field-help">El último dígito calcula vencimientos de IVA e IT; déjalo vacío si no corresponde.</small>{% if errores.nit %}<small class="client-field-error">{{ errores.nit }}</small>{% endif %}</label><label class="client-field"><span>CI</span><input name="ci" data-client-edit-field="ci" value="{% if modal_activo == 'modal-editar' %}{{ datos.ci }}{% endif %}" maxlength="20"><small class="client-field-help">Identificación personal para la ficha del cliente.</small>{% if errores.ci %}<small class="client-field-error">{{ errores.ci }}</small>{% endif %}</label></div>
		<div class="client-form__row"><label class="client-field"><span>Complemento de CI</span><input name="ci_complemento" data-client-edit-field="ci_complemento" value="{% if modal_activo == 'modal-editar' %}{{ datos.ci_complemento }}{% endif %}" maxlength="10"><small class="client-field-help">Ej: A, B, C.</small>{% if errores.ci_complemento %}<small class="client-field-error">{{ errores.ci_complemento }}</small>{% endif %}</label><label class="client-field"><span>CI expedido</span><input name="ci_expedido" data-client-edit-field="ci_expedido" value="{% if modal_activo == 'modal-editar' %}{{ datos.ci_expedido }}{% endif %}" maxlength="20"><small class="client-field-help">Departamento o ciudad donde se emitió el documento.</small>{% if errores.ci_expedido %}<small class="client-field-error">{{ errores.ci_expedido }}</small>{% endif %}</label></div>
		<div class="client-form__row"><label class="client-field"><span>Fecha de nacimiento</span><input name="fecha_nacimiento" data-client-edit-field="fecha_nacimiento" value="{% if modal_activo == 'modal-editar' %}{{ datos.fecha_nacimiento }}{% endif %}" type="date"><small class="client-field-help">Fecha de nacimiento del cliente.</small>{% if errores.fecha_nacimiento %}<small class="client-field-error">{{ errores.fecha_nacimiento }}</small>{% endif %}</label><label class="client-check" style="align-self:flex-end;"><input type="checkbox" name="cambio_contador" value="1" data-client-edit-field="cambio_contador" {% if modal_activo == 'modal-editar' and datos.cambio_contador %}checked{% endif %}> Cambio de contador</label></div>
		<div class="client-form__row"><label class="client-field"><span>Teléfono</span><input name="telefono" data-client-edit-field="telefono" value="{% if modal_activo == 'modal-editar' %}{{ datos.telefono }}{% endif %}" maxlength="30"><small class="client-field-help">Número de contacto principal.</small>{% if errores.telefono %}<small class="client-field-error">{{ errores.telefono }}</small>{% endif %}</label><label class="client-field"><span>WhatsApp</span><input name="whatsapp" data-client-edit-field="whatsapp" value="{% if modal_activo == 'modal-editar' %}{{ datos.whatsapp }}{% endif %}" maxlength="30"><small class="client-field-help">Contacto por WhatsApp del cliente.</small>{% if errores.whatsapp %}<small class="client-field-error">{{ errores.whatsapp }}</small>{% endif %}</label></div>
		<div class="client-form__row"><label class="client-field"><span>Correo</span><input name="correo" data-client-edit-field="correo" value="{% if modal_activo == 'modal-editar' %}{{ datos.correo }}{% endif %}" type="email" maxlength="254"><small class="client-field-help">Correo de contacto para comunicaciones del estudio.</small>{% if errores.correo %}<small class="client-field-error">{{ errores.correo }}</small>{% endif %}</label><label class="client-field"><span>Fecha de inicio</span><input name="fecha_inicio" data-client-edit-field="fecha_inicio" value="{% if modal_activo == 'modal-editar' %}{{ datos.fecha_inicio }}{% endif %}" type="date"><small class="client-field-help">Vigencia inicial sugerida al configurar obligaciones.</small>{% if errores.fecha_inicio %}<small class="client-field-error">{{ errores.fecha_inicio }}</small>{% endif %}</label></div>
		<label class="client-check"><input type="checkbox" name="tiene_representante_legal" value="1" data-toggle-representante-legal data-client-edit-field="tiene_representante_legal" {% if modal_activo == 'modal-editar' and datos.tiene_representante_legal %}checked{% endif %}> Tiene representante legal</label>
		<div class="client-representante-legal-block" data-representante-legal-section {% if modal_activo != 'modal-editar' or not datos.tiene_representante_legal %}hidden{% endif %}>
			<div class="client-form__row"><label class="client-field"><span>Nombre completo del representante legal</span><input name="representante_legal_nombre" data-client-edit-field="representante_legal_nombre" value="{% if modal_activo == 'modal-editar' %}{{ datos.representante_legal_nombre }}{% endif %}" maxlength="180"><small class="client-field-help">Nombre completo del titular legal.</small>{% if errores.representante_legal_nombre %}<small class="client-field-error">{{ errores.representante_legal_nombre }}</small>{% endif %}</label><label class="client-field"><span>Carnet del representante</span><input name="representante_legal_carnet" data-client-edit-field="representante_legal_carnet" value="{% if modal_activo == 'modal-editar' %}{{ datos.representante_legal_carnet }}{% endif %}" maxlength="20"><small class="client-field-help">Carnet de identidad del representante.</small>{% if errores.representante_legal_carnet %}<small class="client-field-error">{{ errores.representante_legal_carnet }}</small>{% endif %}</label></div>
			<div class="client-form__row"><label class="client-field"><span>Complemento</span><input name="representante_legal_complemento" data-client-edit-field="representante_legal_complemento" value="{% if modal_activo == 'modal-editar' %}{{ datos.representante_legal_complemento }}{% endif %}" maxlength="10"><small class="client-field-help">Complemento del carnet.</small>{% if errores.representante_legal_complemento %}<small class="client-field-error">{{ errores.representante_legal_complemento }}</small>{% endif %}</label><label class="client-field"><span>Expedido</span><input name="representante_legal_expedido" data-client-edit-field="representante_legal_expedido" value="{% if modal_activo == 'modal-editar' %}{{ datos.representante_legal_expedido }}{% endif %}" maxlength="20"><small class="client-field-help">Lugar de expedición.</small>{% if errores.representante_legal_expedido %}<small class="client-field-error">{{ errores.representante_legal_expedido }}</small>{% endif %}</label></div>
			<div class="client-form__row"><label class="client-field"><span>Celular</span><input name="representante_legal_celular" data-client-edit-field="representante_legal_celular" value="{% if modal_activo == 'modal-editar' %}{{ datos.representante_legal_celular }}{% endif %}" maxlength="30"><small class="client-field-help">Número para contacto del representante.</small>{% if errores.representante_legal_celular %}<small class="client-field-error">{{ errores.representante_legal_celular }}</small>{% endif %}</label><label class="client-field"><span>Fecha de nacimiento</span><input name="representante_legal_fecha_nacimiento" data-client-edit-field="representante_legal_fecha_nacimiento" value="{% if modal_activo == 'modal-editar' %}{{ datos.representante_legal_fecha_nacimiento }}{% endif %}" type="date"><small class="client-field-help">Fecha de nacimiento del representante.</small>{% if errores.representante_legal_fecha_nacimiento %}<small class="client-field-error">{{ errores.representante_legal_fecha_nacimiento }}</small>{% endif %}</label></div>
		</div>
		<label class="client-field"><span>Dirección</span><input name="direccion" data-client-edit-field="direccion" value="{% if modal_activo == 'modal-editar' %}{{ datos.direccion }}{% endif %}" maxlength="240"><small class="client-field-help">Domicilio registrado en la ficha.</small>{% if errores.direccion %}<small class="client-field-error">{{ errores.direccion }}</small>{% endif %}</label>
		<label class="client-field"><span>Observaciones</span><textarea name="observaciones" data-client-edit-field="observaciones" rows="3">{% if modal_activo == 'modal-editar' %}{{ datos.observaciones }}{% endif %}</textarea><small class="client-field-help">Notas internas del estudio sobre el cliente.</small></label>
		<label class="client-check"><input type="checkbox" name="estado" value="activo" data-client-edit-field="estado" {% if modal_activo == 'modal-editar' and datos.estado == 'activo' %}checked{% endif %}> Cliente activo</label><small class="client-field-help">Solo los clientes activos participan en la generación de obligaciones.</small>
		<footer><button class="button button--quiet" type="button" data-close-modal>Cancelar</button><button class="button button--primary" type="submit">Guardar cambios</button></footer>
	</form></div>
</section>
