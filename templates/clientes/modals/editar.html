<section class="client-modal" id="modal-editar" role="dialog" aria-modal="true" aria-labelledby="modal-editar-title" {% if modal_activo != 'modal-editar' %}hidden{% endif %}>
	<div class="client-modal__backdrop" data-close-modal></div><div class="client-modal__panel"><header><div><p class="eyebrow">ACTUALIZAR REGISTRO</p><h2 id="modal-editar-title">Editar cliente</h2></div><button class="modal-close" type="button" data-close-modal aria-label="Cerrar">Cerrar</button></header>
	<form method="post" class="client-form" data-client-edit-form {% if cliente_edicion %}action="{% url 'clientes:editar' cliente_id=cliente_edicion.pk %}"{% endif %}>{% csrf_token %}
		{% if errores.general %}<p class="client-field-error">{{ errores.general }}</p>{% endif %}
		<label class="client-field"><span>Nombre o razón social <b>*</b></span><input name="nombre" data-client-edit-field="nombre" value="{% if modal_activo == 'modal-editar' %}{{ datos.nombre }}{% endif %}" maxlength="180" required>{% if errores.nombre %}<small class="client-field-error">{{ errores.nombre }}</small>{% endif %}</label>
		<div class="client-form__row"><label class="client-field"><span>Tipo de cliente</span><select name="tipo" data-client-edit-field="tipo" required>{% for value, label in tipos %}<option value="{{ value }}" {% if modal_activo == 'modal-editar' and datos.tipo == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% if errores.tipo %}<small class="client-field-error">{{ errores.tipo }}</small>{% endif %}</label><label class="client-field"><span>Actividad / rubro</span><select name="actividad" data-client-edit-field="actividad" required>{% for value, label in actividades %}<option value="{{ value }}" {% if modal_activo == 'modal-editar' and datos.actividad == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% if errores.actividad %}<small class="client-field-error">{{ errores.actividad }}</small>{% endif %}</label></div>
		<div class="client-form__row"><label class="client-field"><span>NIT</span><input name="nit" data-client-edit-field="nit" value="{% if modal_activo == 'modal-editar' %}{{ datos.nit }}{% endif %}" maxlength="20">{% if errores.nit %}<small class="client-field-error">{{ errores.nit }}</small>{% endif %}</label><label class="client-field"><span>CI</span><input name="ci" data-client-edit-field="ci" value="{% if modal_activo == 'modal-editar' %}{{ datos.ci }}{% endif %}" maxlength="20">{% if errores.ci %}<small class="client-field-error">{{ errores.ci }}</small>{% endif %}</label></div>
		<div class="client-form__row"><label class="client-field"><span>Teléfono</span><input name="telefono" data-client-edit-field="telefono" value="{% if modal_activo == 'modal-editar' %}{{ datos.telefono }}{% endif %}" maxlength="30">{% if errores.telefono %}<small class="client-field-error">{{ errores.telefono }}</small>{% endif %}</label><label class="client-field"><span>WhatsApp</span><input name="whatsapp" data-client-edit-field="whatsapp" value="{% if modal_activo == 'modal-editar' %}{{ datos.whatsapp }}{% endif %}" maxlength="30">{% if errores.whatsapp %}<small class="client-field-error">{{ errores.whatsapp }}</small>{% endif %}</label></div>
		<div class="client-form__row"><label class="client-field"><span>Correo</span><input name="correo" data-client-edit-field="correo" value="{% if modal_activo == 'modal-editar' %}{{ datos.correo }}{% endif %}" type="email" maxlength="254">{% if errores.correo %}<small class="client-field-error">{{ errores.correo }}</small>{% endif %}</label><label class="client-field"><span>Fecha de inicio</span><input name="fecha_inicio" data-client-edit-field="fecha_inicio" value="{% if modal_activo == 'modal-editar' %}{{ datos.fecha_inicio }}{% endif %}" type="date">{% if errores.fecha_inicio %}<small class="client-field-error">{{ errores.fecha_inicio }}</small>{% endif %}</label></div>
		<label class="client-field"><span>Dirección</span><input name="direccion" data-client-edit-field="direccion" value="{% if modal_activo == 'modal-editar' %}{{ datos.direccion }}{% endif %}" maxlength="240">{% if errores.direccion %}<small class="client-field-error">{{ errores.direccion }}</small>{% endif %}</label>
		<label class="client-field"><span>Observaciones</span><textarea name="observaciones" data-client-edit-field="observaciones" rows="3">{% if modal_activo == 'modal-editar' %}{{ datos.observaciones }}{% endif %}</textarea></label>
		<label class="client-check"><input type="checkbox" name="estado" value="activo" data-client-edit-field="estado" {% if modal_activo == 'modal-editar' and datos.estado == 'activo' %}checked{% endif %}> Cliente activo</label>
		<footer><button class="button button--quiet" type="button" data-close-modal>Cancelar</button><button class="button button--primary" type="submit">Guardar cambios</button></footer>
	</form></div>
</section>
