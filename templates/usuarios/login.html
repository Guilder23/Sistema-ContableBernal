{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#9b1b72">
    <title>Iniciar sesión | ContableBernal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/usuarios/login.css' %}">
</head>
<body>
<div class="login-wrapper">
    <!-- Centered Card Container with box shadow -->
    <div class="login-card-window">
        <!-- Background decorative art layer inside the container/window -->
        <div class="art-layer" aria-hidden="true">
            <!-- Background image integrated into a shape/window -->
            <div class="figure-photo-sphere">
                <div class="photo-overlay"></div>
            </div>

            <!-- Organic blobs from reference list (Sidewalk Gum Blob & Star/Skull Blobs) -->
            <div class="blob-shape blob-organic-gum"></div>
            <div class="blob-shape blob-organic-star"></div>

            <!-- Decorative 3D spheres / planets combining mockup style and system palette -->
            <div class="planet planet-top-right">
                <div class="planet-ring"></div>
            </div>
            <div class="planet planet-center-right">
                <div class="planet-slice"></div>
            </div>
            <div class="planet planet-bottom-mid">
                <div class="planet-stripe"></div>
            </div>
            <div class="planet planet-floating-mini"></div>
            <div class="shape shape-ring-saturn"></div>
            <div class="shape shape-glow-accent"></div>
        </div>

        <!-- Main Left-aligned Container containing the white wave card and form -->
        <div class="login-content-area">
            <div class="form-container">
                <div class="brand-header">
                    <a href="/" class="brand-link" aria-label="Contable Bernal Inicio">
                        <img src="{% static 'img/logo.png' %}" alt="Contable Bernal Logo" class="brand-logo">
                        <div class="brand-text">
                            <span class="brand-title">CONTABLE</span>
                            <span class="brand-subtitle">BERNAL</span>
                        </div>
                    </a>
                </div>

                <form class="auth-form" id="login-form" method="post" novalidate>
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ siguiente }}">

                    {% if error %}
                        <div class="form-error" role="alert" aria-live="assertive">
                            <svg class="error-icon" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                            </svg>
                            <span>{{ error }}</span>
                        </div>
                    {% endif %}

                    <div class="form-group">
                        <label for="username" class="field-label">CORREO O USUARIO</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="correo@ejemplo.com" 
                            autocomplete="username" 
                            required 
                            autofocus
                            class="field-input"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password" class="field-label">CONTRASEÑA</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="••••••••••••" 
                                autocomplete="current-password" 
                                required
                                class="field-input password-input"
                            >
                            <button type="button" id="toggle-password" class="btn-toggle-pw" aria-label="Mostrar contraseña" aria-pressed="false" tabindex="-1">
                                <svg class="eye-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-icon eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-label">
                            <input type="checkbox" name="remember" class="remember-checkbox">
                            <span class="custom-checkbox"></span>
                            <span class="checkbox-text">Recordarme</span>
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-login">INGRESAR</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script defer src="{% static 'js/usuarios/login.js' %}"></script>
</body>
</html>
