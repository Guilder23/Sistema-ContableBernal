<section class="user-modal" id="modal-editar" role="dialog" aria-modal="true" aria-labelledby="modal-editar-title" {% if modal_activo != 'modal-editar' %}hidden{% endif %}>
	<div class="user-modal__backdrop" data-close-modal></div><div class="user-modal__panel"><header><div><p class="eyebrow">ACTUALIZAR CUENTA</p><h2 id="modal-editar-title">Editar usuario</h2></div><button class="modal-close" type="button" data-close-modal aria-label="Cerrar">Cerrar</button></header>
	<form method="post" class="modal-form" data-edit-form {% if usuario_edicion %}action="{% url 'usuarios:editar' usuario_id=usuario_edicion.pk %}"{% endif %}>{% csrf_token %}
		{% if errores.general %}<p class="field-error">{{ errores.general }}</p>{% endif %}
		<label>Usuario<input name="username" data-edit-field="username" value="{% if modal_activo == 'modal-editar' %}{{ datos.username }}{% endif %}" maxlength="150" required>{% if errores.username %}<small class="field-error">{{ errores.username }}</small>{% endif %}</label>
		<label>Correo<input name="email" data-edit-field="email" value="{% if modal_activo == 'modal-editar' %}{{ datos.email }}{% endif %}" type="email" maxlength="254">{% if errores.email %}<small class="field-error">{{ errores.email }}</small>{% endif %}</label>
		<div class="modal-form__row"><label>Nombre<input name="first_name" data-edit-field="first_name" value="{% if modal_activo == 'modal-editar' %}{{ datos.first_name }}{% endif %}" maxlength="150"></label><label>Apellido<input name="last_name" data-edit-field="last_name" value="{% if modal_activo == 'modal-editar' %}{{ datos.last_name }}{% endif %}" maxlength="150"></label></div>
		<label>Rol<select name="rol" data-edit-field="rol" required>{% for value, label in roles %}<option value="{{ value }}" {% if modal_activo == 'modal-editar' and datos.rol == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% if errores.rol %}<small class="field-error">{{ errores.rol }}</small>{% endif %}</label>
		<label>Nueva contraseña<input name="password" type="password" autocomplete="new-password">{% if errores.password %}<small class="field-error">{{ errores.password }}</small>{% endif %}</label><label>Confirmar contraseña<input name="password_confirm" type="password" autocomplete="new-password">{% if errores.password_confirm %}<small class="field-error">{{ errores.password_confirm }}</small>{% endif %}</label>
		<label class="modal-check"><input type="checkbox" name="is_active" data-edit-field="is_active" {% if modal_activo == 'modal-editar' and datos.is_active %}checked{% endif %}> Cuenta activa</label>
		<footer><button class="button button--quiet" type="button" data-close-modal>Cancelar</button><button class="button button--primary" type="submit">Guardar cambios</button></footer>
	</form></div>
</section>
