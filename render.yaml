services:
  - type: web
    name: sistema-contable-bernal
    env: python
    buildCommand: bash build.sh
    startCommand: gunicorn sistema_contablebernal.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-contable-bernal-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
databases:
  - name: sistema-contable-bernal-db
    plan: free
    databaseName: sistema_contablebernal
    user: sistema_contablebernal
